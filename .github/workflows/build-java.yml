name: Build APK v3

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          cat pojav.part* > pojav.zip
          unzip -q pojav.zip
          cp -r PojavLauncher-gladiolus/. .
          rm -rf PojavLauncher-gladiolus pojav.zip

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          github_token: ${{secrets.LTW_CLONER_SECRET}}
          repo: PojavLauncherTeam/BigTinyWrapper
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs
          allow_forks: false

      - name: Get Java runtimes from the official PojavLauncher "gladiolus" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rel && cd /tmp/rel
          echo "Release assets:"
          gh release view gladiolus -R PojavLauncherTeam/PojavLauncher --json assets --jq '.assets[] | "\(.name)  \(.size)"' || true
          gh release download gladiolus -R PojavLauncherTeam/PojavLauncher -p '*.apk' || true
          ls -la
          ASSETS="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/components"
          mkdir -p "$ASSETS"
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            unzip -l "$apk" | grep 'assets/components/jre' | head -30 || true
            rm -rf x && mkdir x
            unzip -q "$apk" 'assets/components/jre*' -d x || true
            for d in x/assets/components/jre*; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              mkdir -p "$ASSETS/$name"
              cp -r "$d"/. "$ASSETS/$name/"
            done
          done

      - name: Fallback for Java 8 (Amethyst prebuilt APK)
        run: |
          ASSETS="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/components"
          if [ -f "$ASSETS/jre/version" ]; then echo "Java 8 already present, skipping"; exit 0; fi
          mkdir -p /tmp/amethyst && cd /tmp/amethyst
          curl -fL --retry 3 -o amethyst.zip "https://nightly.link/AngelAuraMC/Amethyst-Android/workflows/android/v3_openjdk/app-debug%20%28recommended%29.zip"
          unzip -q amethyst.zip
          APK=$(find . -name '*.apk' | head -n1)
          unzip -q "$APK" 'assets/components/jre/*' -d apk
          mkdir -p "$ASSETS/jre"
          cp -r apk/assets/components/jre/. "$ASSETS/jre/"

      - name: Check Java runtimes
        run: |
          A=app_pojavlauncher/src/main/assets/components
          for d in jre jre-new jre-21; do
            if [ -f "$A/$d/version" ]; then echo "OK      $d"; else echo "MISSING $d"; fi
          done
          test -f "$A/jre/version" || { echo "ERROR: Java 8 is missing"; exit 1; }
          test -f "$A/jre-new/version" || { echo "ERROR: Java 17 is missing (LabyMod needs it)"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*
