name: Build APK v2

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          cat pojav.part* > pojav.zip
          unzip -q pojav.zip
          cp -r PojavLauncher-gladiolus/. .
          rm -rf PojavLauncher-gladiolus pojav.zip

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          github_token: ${{secrets.LTW_CLONER_SECRET}}
          repo: PojavLauncherTeam/BigTinyWrapper
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs
          allow_forks: false

      - name: Get Java 8 from Amethyst prebuilt APK
        run: |
          mkdir -p /tmp/amethyst && cd /tmp/amethyst
          curl -fL --retry 3 -o amethyst.zip "https://nightly.link/AngelAuraMC/Amethyst-Android/workflows/android/v3_openjdk/app-debug%20%28recommended%29.zip"
          unzip -q amethyst.zip
          APK=$(find . -name '*.apk' | head -n1)
          echo "Using APK: $APK"
          unzip -l "$APK" | grep 'assets/components/' | grep -v 'lwjgl' | head -40 || true
          unzip -q "$APK" 'assets/components/jre*' -d apk || true
          ASSETS="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/components"
          for d in apk/assets/components/jre*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            mkdir -p "$ASSETS/$name"
            cp -r "$d"/. "$ASSETS/$name/"
          done
          echo "Installed runtimes:"
          ls -la "$ASSETS"
          test -f "$ASSETS/jre/version" || { echo "ERROR: Java 8 runtime was not found in the Amethyst APK"; exit 1; }

      - name: Try to get Java 17
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav

      - name: Try to get Java 21
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      - name: Report which Java runtimes are included
        run: |
          A=app_pojavlauncher/src/main/assets/components
          for d in jre jre-new jre-21; do
            if [ -f "$A/$d/version" ]; then echo "OK      $d"; else echo "MISSING $d"; fi
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*
